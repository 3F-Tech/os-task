# =============================================================================
# Nginx — 3F Hub (Huly)
# Domínio: 3ftasks.3fventure.tech
#
# Como aplicar na VPS:
#   cp /opt/apps/os-tasks/dev/nginx/3ftasks.conf /etc/nginx/sites-available/3ftasks
#   nginx -t && systemctl reload nginx
# =============================================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name 3ftasks.3fventure.tech;
    return 301 https://$host$request_uri;
}

# Frontend principal (HTTPS porta 443)
server {
    listen 443 ssl;
    server_name 3ftasks.3fventure.tech;

    ssl_certificate /etc/letsencrypt/live/3ftasks.3fventure.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3ftasks.3fventure.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /_calendar/ {
        proxy_pass http://localhost:18095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /image/ {
        proxy_pass http://localhost:14040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        proxy_pass http://localhost:4031/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500M;
    }

    location /_love/ {
        proxy_pass http://localhost:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_livekit/ {
        proxy_pass http://localhost:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /_pulse/ {
        proxy_pass http://localhost:8099/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://localhost:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# Account API (porta 3000)
server {
    listen 3000 ssl;
    server_name 3ftasks.3fventure.tech;

    ssl_certificate /etc/letsencrypt/live/3ftasks.3fventure.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3ftasks.3fventure.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_hide_header "Access-Control-Allow-Credentials";
        proxy_hide_header "Access-Control-Allow-Origin";

        proxy_pass http://localhost:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        add_header "Access-Control-Allow-Origin" "https://3ftasks.3fventure.tech" always;
        add_header "Access-Control-Allow-Credentials" "true" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization, x-timezone" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, PUT, DELETE" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

