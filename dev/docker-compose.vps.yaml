services:
  stream:
    image: 'hardcoreeng/stream'
    extra_hosts:
      - 'huly.local:host-gateway'
    container_name: stream
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4030
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - STREAM_REGION=cockroach
      - STREAM_QUEUE_CONFIG=redpanda:9092
    ports:
      - 1080:1080
    restart: unless-stopped
  # preview: disabled — hardcoreeng/preview not yet published to Docker Hub
  # link-preview: disabled — hardcoreeng/link-preview not yet published to Docker Hub
  cockroach:
    image: cockroachdb/cockroach:latest-v24.3
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - '26257:26257'
      - '8089:8080'
    command: start-single-node --insecure
    volumes:
      - cockroach_db:/cockroach/cockroach-data
    restart: unless-stopped
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    extra_hosts:
      - 'huly.local:host-gateway'
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 512M
    container_name: redpanda
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    restart: unless-stopped
  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    extra_hosts:
      - 'huly.local:host-gateway'
    expose:
      - 9000
      - 9001
    ports:
      - 9002:9000
      - 9003:9001
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic:
    image: 'elasticsearch:7.14.2'
    expose:
      - 9200
    extra_hosts:
      - 'huly.local:host-gateway'
    volumes:
      - elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
  redis:
    image: redis:8.0.2-alpine3.21
    ports:
      - 6379:6379
    restart: unless-stopped

  account:
    image: hardcoreeng/account
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - stats
    ports:
      - 13000:3000
    volumes:
      - ./branding.json:/var/cfg/branding.json
      - ../pods/account/bundle/bundle.js:/usr/src/app/bundle.js
    environment:
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - STATS_URL=http://stats:4900
      - WORKSPACE_LIMIT_PER_USER=10000
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - REGION_INFO=cockroach|CockroachDB
      - TRANSACTOR_URL=wss://3ftasks.3fventure.tech:3332;;cockroach,
      - MAIL_URL=
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=https://3ftasks.3fventure.tech
      - LAST_NAME_FIRST=true
      - ACCOUNTS_URL=http://account:3000
      - BRANDING_PATH=/var/cfg/branding.json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - MAILBOX_DOMAINS=huly.dev.local
      - MAILBOX_MAX_COUNT_PER_ACCOUNT=2
    restart: unless-stopped
  stats:
    image: hardcoreeng/stats
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 4900:4900
    environment:
      - PORT=4900
      - SERVER_SECRET=secret
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  # payment: disabled — hardcoreeng/payment not yet published to Docker Hub
  workspace_cockroach:
    image: hardcoreeng/workspace
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - cockroach
      - minio
      - stats
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=cockroach
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=redpanda:9092
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      - MAIL_URL=
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  collaborator:
    image: hardcoreeng/collaborator
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - transactor_cockroach
      - stats
    ports:
      - 13078:3078
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  front:
    image: hardcoreeng/front
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - stats
    ports:
      - 8087:8080
      - 8088:8080
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_URL_CLIENT=https://3ftasks.3fventure.tech:3000
      - STATS_URL=http://stats:4900
      - FILES_URL=http://datalake:4030/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=/files
      - PREVIEW_URL=http://preview:4040
      - GMAIL_URL=http://huly.local:8093
      - CALENDAR_URL=https://3ftasks.3fventure.tech:8095
      - TELEGRAM_URL=http://huly.local:8086
      - REKONI_URL=http://rekoni:4004
      - COLLABORATOR_URL=wss://3ftasks.3fventure.tech:3078
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - GITHUB_URL=http://huly.local:3500
      - PRINT_URL=http://print:4005
      - SIGN_URL=http://sign:4006
      - DESKTOP_UPDATES_URL=https://dist.huly.io
      - DESKTOP_UPDATES_CHANNEL=dev
      - DESKTOP_UPDATES_CHANNELS=dev;tracex:dev-tracex
      - BRANDING_URL=https://3ftasks.3fventure.tech/branding.json
      - STREAM_URL=http://stream:1080/recording
      - PAYMENT_URL=http://payment:3040
      - COMMUNICATION_API_ENABLED=true
      - BACKUP_URL=http://backup-api:4039/api/backup,
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=[]
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - PULSE_URL=wss://3ftasks.3fventure.tech:8099/ws
      - DATALAKE_URL=http://datalake:4030
      - HULYLAKE_URL=http://hulylake:8096
      - EXPORT_URL=http://export:4009
      - LINK_PREVIEW_URL=http://link-preview:4041
    volumes:
      - ../pods/front/bundle/bundle.js:/app/bundle.js
      - ../pods/front/dist:/app/dist
    restart: unless-stopped
  transactor_cockroach:
    image: hardcoreeng/transactor
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - cockroach
      - minio
      - account
      - stats
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - 13332:3332
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_PORT=3332
      - REGION=cockroach
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://fulltext_cockroach:4702
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=https://3ftasks.3fventure.tech
      - MAIL_URL=''
      - ACCOUNTS_URL=http://account:3000
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://huly.local:4010
      - COMMUNICATION_TIME_LOGGING_ENABLED=true
      - RATE_LIMIT_MAX=250
      - RATE_LIMIT_WINDOW=30000
      - FILES_URL=http://datalake:4030/blob/:workspace/:blobId/:filename
      - COMMUNICATION_API_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - HYLYLAKE_URL=http://hulylake:8096
    restart: unless-stopped
  rekoni:
    image: hardcoreeng/rekoni-service
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4004:4004
    environment:
      - STATS_URL=http://stats:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  fulltext_cockroach:
    image: hardcoreeng/fulltext
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped
    links:
      - elastic
      - cockroach
      - rekoni
    ports:
      - 4702:4702
    environment:
      - PORT=4702
      - REGION=cockroach
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=redpanda:9092
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - HULYLAKE_URL=http://hulylake:8096
      - COMMUNICATION_API_ENABLED=true
  print:
    image: hardcoreeng/print
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4005:4005
    environment:
      - SECRET=secret
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
      - ACCOUNTS_URL=http://account:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - FRONT_URL=https://3ftasks.3fventure.tech
  sign:
    image: hardcoreeng/sign
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4006:4006
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - MINIO_ENDPOINT=minio
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - SERVICE_ID=sign-service
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  analytics:
    image: hardcoreeng/analytics-collector
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4017:4017
    environment:
      - SECRET=secret
      - PORT=4017
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  export:
    image: hardcoreeng/export
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - stats
    ports:
      - 4009:4009
    environment:
      - PORT=4009
      - SECRET=secret
      - SERVICE_ID=export-service
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  datalake:
    image: hardcoreeng/datalake
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4031:4030
    environment:
      - PORT=4030
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STREAM_URL=http://stream:1080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    restart: unless-stopped
  # hulylake: disabled — hardcoreeng/hulylake (Rust) not yet published to Docker Hub
  # hulykvs: disabled — hardcoreeng/hulykvs not yet published to Docker Hub
  # hulygun: disabled — hardcoreeng/hulygun not yet published to Docker Hub
  # hulypulse: disabled — hardcoreeng/hulypulse not yet published to Docker Hub
  # process-service: disabled — hardcoreeng/process not yet published to Docker Hub
  # time-machine: disabled — hardcoreeng/worker not yet published; rebuild from local with: ./3f-build.sh --pod worker
  backup-cockroach:
    image: hardcoreeng/backup
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - REGION=cockroach
      - BUCKET_NAME=backups
      - INTERVAL=60
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - WORKSPACE_STORAGE=datalake|http://datalake:4030
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - QUEUE_CONFIG=redpanda:9092
      - TEMPORAL_ADDRESS=localhost:7233
    restart: unless-stopped
  # backup-api: disabled — hardcoreeng/backup-api not yet published to Docker Hub
  # rating_cockroach: disabled — hardcoreeng/rating not yet published to Docker Hub
  jaeger:
    image: jaegertracing/all-in-one:latest
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
    volumes:
      - telemetry:/badger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    restart: unless-stopped
  calendar:
    image: hardcoreeng/base-slim:v20250916
    working_dir: /usr/src/app
    command: node bundle.js
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      account:
        condition: service_started
    ports:
      - 18095:8095
    volumes:
      - ../services/calendar/pod-calendar/bundle/bundle.js:/usr/src/app/bundle.js
    env_file:
      - .env.secrets
    environment:
      - PORT=8095
      - ACCOUNTS_URL=http://account:3000
      - SECRET=secret
      - KVS_URL=http://hulykvs:8094
      - WATCH_URL=https://3ftasks.3fventure.tech:8095
      - SERVICE_ID=calendar-service
    restart: unless-stopped
volumes:
  db:
  dbpg:
  files:
  elastic:
  cockroach_db:
  redpanda:
  telemetry:
