services:
  stream:
    image: 'hardcoreeng/stream:v0.7.413'
    extra_hosts:
      - 'huly.local:host-gateway'
    container_name: stream
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4030
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - STREAM_REGION=cockroach
      - STREAM_QUEUE_CONFIG=redpanda:9092
    ports:
      - 1080:1080
    restart: unless-stopped
  preview:
    image: hardcoreeng/preview:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    container_name: preview
    depends_on:
      datalake:
        condition: service_started
    environment:
      - SECRET=secret
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - CACHE_PATH=/data/cache
    ports:
      - 14040:4040
    restart: unless-stopped
  # link-preview: disabled — hardcoreeng/link-preview not yet published to Docker Hub
  cockroach:
    image: cockroachdb/cockroach:latest-v24.3
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - '26257:26257'
      - '8089:8080'
    command: start-single-node --insecure
    volumes:
      - /opt/apps/os-tasks/data/cockroach:/cockroach/cockroach-data
    restart: unless-stopped
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    extra_hosts:
      - 'huly.local:host-gateway'
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 512M
    container_name: redpanda
    volumes:
      - /opt/apps/os-tasks/data/redpanda:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    restart: unless-stopped
  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    extra_hosts:
      - 'huly.local:host-gateway'
    expose:
      - 9000
      - 9001
    ports:
      - 9002:9000
      - 9003:9001
    volumes:
      - /opt/apps/os-tasks/data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic:
    image: 'elasticsearch:7.14.2'
    expose:
      - 9200
    extra_hosts:
      - 'huly.local:host-gateway'
    volumes:
      - /opt/apps/os-tasks/data/elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
  redis:
    image: redis:8.0.2-alpine3.21
    ports:
      - 6379:6379
    restart: unless-stopped

  mail:
    image: hardcoreeng/mail:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    env_file:
      - .env.secrets
    environment:
      - PORT=8092
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_TLS_MODE=upgrade
    restart: unless-stopped

  account:
    image: hardcoreeng/account:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - stats
    ports:
      - 13000:3000
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - STATS_URL=http://stats:4900
      - WORKSPACE_LIMIT_PER_USER=10000
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - REGION_INFO=cockroach|CockroachDB
      # Formato: internal;external;region — internal usado por serviços
      # dentro do Docker (ws plain, hostname interno), external usado por
      # browsers (wss público). Evita hairpin routing: calendar/github/etc
      # falavam wss://3ftasks.3fventure.tech:3332 saindo do container pra
      # voltar pelo mesmo host, dando timeout no WebSocket.
      - TRANSACTOR_URL=ws://transactor_cockroach:3332;wss://3ftasks.3fventure.tech:3332;cockroach,
      - MAIL_URL=http://mail:8092
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=https://3ftasks.3fventure.tech
      - LAST_NAME_FIRST=true
      - ACCOUNTS_URL=http://account:3000
      - BRANDING_PATH=/var/cfg/branding.json
      - MAILBOX_DOMAINS=huly.dev.local
      - MAILBOX_MAX_COUNT_PER_ACCOUNT=2
      - MAX_FAILED_LOGIN_ATTEMPTS=0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  stats:
    image: hardcoreeng/stats:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    ports:
      - 4900:4900
    environment:
      - PORT=4900
      - SERVER_SECRET=secret
    restart: unless-stopped
  # payment: disabled — hardcoreeng/payment not yet published to Docker Hub
  workspace_cockroach:
    image: hardcoreeng/workspace:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - cockroach
      - minio
      - stats
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=cockroach
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=redpanda:9092
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      - MAIL_URL=http://mail:8092
    restart: unless-stopped
  collaborator:
    image: hardcoreeng/collaborator:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - transactor_cockroach
      - stats
    ports:
      - 13078:3078
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
    stop_grace_period: 60s
    restart: unless-stopped
  front:
    image: hardcoreeng/front:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - stats
    ports:
      - 8087:8080
      - 8088:8080
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=secret
      - ACCOUNTS_URL=https://3ftasks.3fventure.tech:3000
      - STATS_URL=http://stats:4900
      - FILES_URL=https://3ftasks.3fventure.tech/files/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=/files
      - PREVIEW_URL=https://3ftasks.3fventure.tech
      - GMAIL_URL=http://huly.local:8093
      - CALENDAR_URL=https://3ftasks.3fventure.tech/_calendar
      - TELEGRAM_URL=http://huly.local:8086
      - REKONI_URL=http://rekoni:4004
      - COLLABORATOR_URL=wss://3ftasks.3fventure.tech:3078
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - GITHUB_URL=https://3ftasks.3fventure.tech:3500
      - GITHUB_APP=os-tasks
      - GITHUB_CLIENTID=Iv23liz1iroLtzYJl96V
      - PRINT_URL=http://print:4005
      - SIGN_URL=http://sign:4006
      - DESKTOP_UPDATES_URL=https://dist.huly.io
      - DESKTOP_UPDATES_CHANNEL=dev
      - DESKTOP_UPDATES_CHANNELS=dev;tracex:dev-tracex
      - BRANDING_URL=https://3ftasks.3fventure.tech/branding.json
      - STREAM_URL=http://stream:1080/recording
      - PAYMENT_URL=http://payment:3040
      # Communication API desabilitada — depende do hulylake (não publicado no Docker Hub)
      - COMMUNICATION_API_ENABLED=false
      - BACKUP_URL=http://backup-api:4039/api/backup,
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=[]
      - PULSE_URL=wss://3ftasks.3fventure.tech/_pulse/ws
      - DATALAKE_URL=https://3ftasks.3fventure.tech/files
      - EXPORT_URL=http://export:4009
      - LINK_PREVIEW_URL=http://link-preview:4041
      - LOVE_ENDPOINT=https://3ftasks.3fventure.tech/_love
      - LIVEKIT_WS=wss://3ftasks.3fventure.tech/_livekit
    restart: unless-stopped
  transactor_cockroach:
    image: hardcoreeng/transactor:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - cockroach
      - minio
      - account
      - stats
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - 13332:3332
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - TZ=America/Sao_Paulo
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_PORT=3332
      - REGION=cockroach
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://fulltext_cockroach:4702
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - FRONT_URL=https://3ftasks.3fventure.tech
      - MAIL_URL=http://mail:8092
      - ACCOUNTS_URL=http://account:3000
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://huly.local:4010
      - COMMUNICATION_TIME_LOGGING_ENABLED=true
      - RATE_LIMIT_MAX=250
      - RATE_LIMIT_WINDOW=30000
      - FILES_URL=https://3ftasks.3fventure.tech/files/blob/:workspace/:blobId/:filename
      # Communication API desabilitada — depende do hulylake (não publicado no Docker Hub)
      - COMMUNICATION_API_ENABLED=false
      # URL pública do calendar service — necessária para o trigger OnEvent enviar
      # eventos do Huly para o Google Calendar via pod-calendar (/event endpoint).
      - CALENDAR_URL=https://3ftasks.3fventure.tech/_calendar
    restart: unless-stopped
  github:
    image: hardcoreeng/github:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      account:
        condition: service_started
    ports:
      - 13500:3500
    environment:
      - PORT=3500
      - SERVER_SECRET=secret
      - BOT_NAME=os-tasks[bot]
      - ACCOUNTS_URL=http://account:3000
      - COLLABORATOR_URL=ws://collaborator:3078
      - FRONT_URL=https://3ftasks.3fventure.tech
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
    env_file:
      - .env.github
    restart: unless-stopped
  rekoni:
    image: hardcoreeng/rekoni-service:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4004:4004
    environment:
      - STATS_URL=http://stats:4900
  fulltext_cockroach:
    image: hardcoreeng/fulltext:3f-local 
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped
    links:
      - elastic
      - cockroach
      - rekoni
    ports:
      - 4702:4702
    environment:
      - PORT=4702
      - REGION=cockroach
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=redpanda:9092
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - HULYLAKE_URL=http://hulylake:8096
      - COMMUNICATION_API_ENABLED=true
  print:
    image: hardcoreeng/print:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4005:4005
    environment:
      - SECRET=secret
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STATS_URL=http://stats:4900
      - ACCOUNTS_URL=http://account:3000
      - FRONT_URL=https://3ftasks.3fventure.tech
  sign:
    image: hardcoreeng/sign:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4006:4006
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - MINIO_ENDPOINT=minio
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - SERVICE_ID=sign-service
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4900
  analytics:
    image: hardcoreeng/analytics-collector:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    restart: unless-stopped
    ports:
      - 4017:4017
    environment:
      - SECRET=secret
      - PORT=4017
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
  export:
    image: hardcoreeng/export:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    links:
      - minio
      - stats
    ports:
      - 4009:4009
    environment:
      - PORT=4009
      - SECRET=secret
      - SERVICE_ID=export-service
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - ACCOUNTS_URL=http://account:3000
    restart: unless-stopped
  datalake:
    image: hardcoreeng/datalake:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    ports:
      - 4031:4030
    environment:
      - PORT=4030
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - REGION=cockroach
      - QUEUE_CONFIG=redpanda:9092
      - STREAM_URL=http://stream:1080
    restart: unless-stopped
  # hulylake: disabled — hardcoreeng/hulylake (Rust) not yet published to Docker Hub
  # hulykvs: disabled — hardcoreeng/hulykvs not yet published to Docker Hub
  # hulygun: disabled — hardcoreeng/hulygun not yet published to Docker Hub
  hulypulse:
    image: hardcoreeng/hulypulse:v0.7.423
    container_name: hulypulse
    depends_on:
      redis:
        condition: service_started
    ports:
      - 8099:8099
    environment:
      - HULY_REDIS_URLS=redis://redis:6379
      - HULY_BIND_PORT=8099
    restart: unless-stopped
  # process-service: disabled — hardcoreeng/process not yet published to Docker Hub
  time-machine:
    image: hardcoreeng/worker
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_healthy
      cockroach:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
      - DB_URL=${DB_CR_URL}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=cockroach
      - ACCOUNTS_URL=http://account:3000
      - TRANSACTOR_INTERNAL_URL=ws://transactor_cockroach:3332
      - SECRET=secret
      - MAIL_URL=http://mail:8092
      - FRONT_URL=https://3ftasks.3fventure.tech
      - DIGEST_HOUR=8
      - DIGEST_MINUTE=30
      - DIGEST_TIMEZONE=America/Sao_Paulo
    restart: unless-stopped
  backup-cockroach:
    image: hardcoreeng/backup:v0.7.413
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      stats:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - STATS_URL=http://stats:4900
      - DB_URL=postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      - REGION=cockroach
      - BUCKET_NAME=backups
      - INTERVAL=60
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - WORKSPACE_STORAGE=datalake|http://datalake:4030
      - QUEUE_CONFIG=redpanda:9092
      - TEMPORAL_ADDRESS=localhost:7233
    restart: unless-stopped
  # backup-api: disabled — hardcoreeng/backup-api not yet published to Docker Hub
  # rating_cockroach: disabled — hardcoreeng/rating not yet published to Docker Hub
  # jaeger: removido em 2026-06-09 — badger sem retention encheu 39 GB de disco e não estava sendo usado para debug
  hulykvs:
    image: node:20-slim
    command: node /app/server.js
    volumes:
      - ../services/hulykvs/server.js:/app/server.js
      # Persiste syncTokens/watches do calendar service para sobreviver a restart.
      - /opt/apps/os-tasks/data/hulykvs:/data
    environment:
      - PORT=8094
      - STORE_PATH=/data/store.json
    restart: unless-stopped

  calendar:
    image: hardcoreeng/calendar:3f-local
    extra_hosts:
      - 'huly.local:host-gateway'
    depends_on:
      account:
        condition: service_started
      hulykvs:
        condition: service_started
    ports:
      - 18095:8095
    env_file:
      - .env.secrets
    environment:
      - PORT=8095
      - ACCOUNTS_URL=http://account:3000
      - SECRET=secret
      - KVS_URL=http://hulykvs:8094
      - WATCH_URL=https://3ftasks.3fventure.tech/_calendar
      - SERVICE_ID=calendar-service
      # Safety-net periodic sync (minutos). Captura eventos que escaparam do push
      # notification do Google. 0 desativa. Padrão do código é 30.
      - PERIODIC_SYNC_INTERVAL=30
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    depends_on:
      redis:
        condition: service_started
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    ports:
      - 7880:7880
      - 7881:7881
      - 50000-50100:50000-50100/udp
    restart: unless-stopped
  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    depends_on:
      redis:
        condition: service_started
      livekit:
        condition: service_started
    cap_add:
      - SYS_ADMIN
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml
      - livekit_egress_tmp:/tmp/livekit-egress
    restart: unless-stopped
  love:
    image: hardcoreeng/love:v0.7.413
    depends_on:
      account:
        condition: service_started
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - 8097:8097
    environment:
      - PORT=8097
      - SECRET=secret
      - SERVICE_ID=love-service
      - ACCOUNTS_URL=http://account:3000
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - STORAGE_PROVIDER_NAME=datalake
      # Gravação desativada — VPS atual tem 2 cores e o livekit-egress exige mínimo 3.
      # Reativar quando a VPS for upgrade para 4+ cores:
      # - S3_STORAGE_CONFIG=s3|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin&region=local&rootBucket=recordings
      # - RECORDING_PRESET=720p
    restart: unless-stopped
volumes:
  db:
  dbpg:
  livekit_egress_tmp:
